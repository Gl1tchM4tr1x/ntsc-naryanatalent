<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Portal</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body>
    <div id="app" class="app-shell">
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu"><span class="fa-icon">&#xf0c9;</span></button>
        <div class="mobile-overlay" id="mobileOverlay"></div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-blue">
                <button class="hamburger" id="hamburger" aria-label="menu"><span class="fa-icon">&#xf0c9;</span></button>
                <img src="assets/images/avatar_image.png" alt="Profile" class="side-avatar" />
                <div class="side-name" id="sideName">STUDENT</div>
                <div class="side-email" id="sideEmail"></div>
            </div>
            <nav class="side-menu" id="sideMenu"></nav>
            <button class="sidebar-logout" id="sidebarLogout" type="button">Logout</button>
        </aside>

        <main class="main-content" id="mainContent"></main>
    </div>

    <div class="toast" id="toast"></div>
    <script src="assets/js/portal-store.js"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
