# NTS Student Portal - Render blueprint
#
# One-click deploy for https://render.com. The service mounts a persistent disk
# so the JSON store (timetables, attendance, sessions, audit log) survives
# deploys and restarts. ADMIN_TOKEN must be entered once in the Render dashboard
# when the service is first created.
#
# Notes:
# - rootDir is the repo root (NOT server/) because the frontend lives in
#   localhost8081/ and the backend in server/. Both must ship to the instance.
# - Render sets PORT automatically; HOST is bound to 0.0.0.0.
# - DATA_DIRECTORY=/data keeps the store on the attached persistent disk.

services:
  - type: web
    name: ntsc-portal
    runtime: node
    plan: free
    rootDir: .
    buildCommand: cd server && npm install --omit=dev
    startCommand: cd server && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIRECTORY
        value: /data
      # Fatal if missing in production; fill it in the Render dashboard.
      - key: ADMIN_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: portal-data-disk
      mountPath: /data
      sizeGB: 1
      readOnly: false
