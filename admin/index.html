<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Portal - Admin</title>
    <link rel="icon" href="../student/favicon.ico" />
    <link rel="stylesheet" href="../student/assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/admin.css" />
</head>

<body>
    <div id="app" class="app-shell">
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu"><span class="fa-icon">&#xf0c9;</span></button>
        <div class="mobile-overlay" id="mobileOverlay"></div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-blue">
                <button class="hamburger" id="hamburger" aria-label="menu"><span class="fa-icon">&#xf0c9;</span></button>
                <img src="../student/assets/images/avatar_image.png" alt="Admin" class="side-avatar" />
                <div class="side-name">ADMIN</div>
                <div class="side-email">PORTAL ADMIN</div>
            </div>
            <nav class="side-menu" id="sideMenu"></nav>
            <button class="sidebar-logout" id="adminSidebarLogout" type="button">Logout</button>
        </aside>

        <main class="main-content" id="mainContent"></main>
    </div>

    <div class="toast" id="toast"></div>
    <script src="assets/js/admin-app.js"></script>
</body>

</html>
